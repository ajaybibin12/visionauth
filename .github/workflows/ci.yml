name: VisionAuth CI

on:
  push:
    branches:
      - develop
      - feature/**
  pull_request:
    branches:
      - develop
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visionauth_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_NAME: VisionAuth
      APP_VERSION: 0.1.0
      ENVIRONMENT: testing
      DEBUG: false

      API_V1_PREFIX: /api/v1

      HOST: 127.0.0.1
      PORT: 8000

      # Application database
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/visionauth_test

      # Test database
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/visionauth_test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Dependencies
        run: uv sync --all-groups

      - name: Apply Alembic Migrations
        run: uv run alembic upgrade head

      - name: Ruff
        run: uv run ruff check .

      - name: Black
        run: uv run black --check .

      - name: MyPy
        run: uv run mypy app

      - name: Pytest
        run: uv run pytest
