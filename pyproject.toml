[project]
name = "visionauth"
version = "0.1.0"
description = "Production-ready AI-powered facial authentication platform built with FastAPI and InsightFace."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.139.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.21",
]

# -------------------------------------------------
# Black
# -------------------------------------------------

[tool.black]
line-length = 88
target-version = ["py314"]

# -------------------------------------------------
# Ruff
# -------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py314"

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".pytest_cache",
]

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
]

# -------------------------------------------------
# Pytest
# -------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
asyncio_mode = "auto"

# -------------------------------------------------
# MyPy
# -------------------------------------------------

[tool.mypy]
python_version = "3.14"

warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

check_untyped_defs = true
disallow_untyped_defs = true
